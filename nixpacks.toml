[phases.setup]
nixpkgsArchive = "da6dc0e7b26060f2f71ce3ef7088fb56ee44fa36"
nixPkgs = ["php85", "php85Packages.composer", "nginx", "nodejs_22"]

[phases.install]
cmds = [
  "php -r 'exit(version_compare(PHP_VERSION, \"8.5.12\", \">=\") ? 0 : 1);' || (echo 'PHP < 8.5.12: vulnerable a PHP2Shell' && php -v && exit 1)",
  "apt-get update && apt-get install -y supervisor",
  "mkdir -p /var/log/nginx /var/cache/nginx /var/log/supervisor",
  "composer install --no-dev --optimize-autoloader --ignore-platform-reqs",
  "npm ci"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = """php artisan migrate --force && php artisan db:seed --class=RoleAndAdminSeeder --force && php artisan optimize && node /assets/scripts/prestart.mjs /assets/nginx.template.conf /nginx.conf && cp /app/supervisord.conf /etc/supervisor/conf.d/laravel.conf && supervisord -c /etc/supervisor/conf.d/laravel.conf"""